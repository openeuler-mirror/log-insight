# log-insight 发布编排 — 使用预构建镜像, 无需源码构建
# 配合 Jenkins 发布产物 (loginsight-backend-<版本>-<arch>.tar.gz 等) 使用:
#   docker load -i loginsight-backend-*.tar.gz
#   docker load -i loginsight-frontend-*.tar.gz
#   BACKEND_IMAGE=loginsight-backend:latest-arm64 FRONTEND_IMAGE=loginsight-frontend:latest-arm64 \
#     docker compose -f docker-compose.release.yml up -d
# 生产务必通过同目录 .env 覆盖 SECRET_KEY

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loginsight
      POSTGRES_PASSWORD: loginsight
      POSTGRES_DB: loginsight
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loginsight"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    image: ${BACKEND_IMAGE:-loginsight-backend:latest-arm64}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://loginsight:loginsight@postgres:5432/loginsight
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-CHANGE-ME-IN-PRODUCTION}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - app_data:/srv/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    image: ${BACKEND_IMAGE:-loginsight-backend:latest-arm64}
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend_env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
    volumes:
      - app_data:/srv/app/data
    depends_on:
      - api
    restart: unless-stopped

  web:
    image: ${FRONTEND_IMAGE:-loginsight-frontend:latest-arm64}
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  app_data:
